<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <link rel="stylesheet" href="src/styles.css" />
    <title>Ellie's AI Recipe Generator</title>
  </head>
  <body>
    <header>
      <h1>AI Powered Recipe Generator<span class="blink">🥗</span></h1>
      <p>
        Welcome to your personal kitchen assistant!<br />
        Enter one key ingredient below to get a simple recipe.
      </p>
    </header>

    <main>
      <form id="search-bar">
        <input
          type="text"
          id="search-input"
          placeholder="Enter an ingredient (e.g., egg, chicken or potato...)"
          required
          autocomplete="off"
        />
        <button id="submit-button" type="submit">Get a recipe</button>
      </form>

      <section class="hide" id="recipe-display">
        <h3 id="searching"></h3>
        <div id="recipe"></div>
      </section>
    </main>

    <footer>
      This project was coded by
      <a href="https://github.com/elgit-uk" target="_blank">Ellie</a>. Open
      sourced on
      <a href="https://github.com/elgit-uk/recipe-generator" target="_blank">
        Github
      </a>
      , hosted on
      <a
        href="https://app.netlify.com/projects/ellies-ai-recipe-generator/overview"
        target="_blank"
      >
        Netlify</a
      >
    </footer>
    <script src="src/index.js"></script>
  </body>
</html>
